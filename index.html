<!-- ⚠️ تم تعديل: toggleCard / toggleShow / renderList (isOpen + masked) فقط -->

<script>
// ====== CONFIG ======
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw4PZ_KhvLMepMaLEpkkB6jgDMZzGEnTYiXypVMXMKbBFSzmkGYdPWnT4EWr0P4eyHozQ/exec';

// ====== STATE ======
let passwords = [];
let groups = ['عام','فيسبوك','جيميل','بنوك'];
let activeGroup = 'الكل';
let openCards = {}, showCards = {};
let editMode = false;
let currentPin = '';

// ====== UNLOCK ======
async function unlockApp() {
  const pin = document.getElementById('pin-input').value.trim();
  const errEl = document.getElementById('lock-error');

  if (pin.length < 4) {
    errEl.textContent = '⚠ PIN لازم 4 أرقام';
    return;
  }

  const btn = document.getElementById('lock-btn');
  btn.textContent = '...جاري التحقق';
  btn.disabled = true;

  try {
    const res = await fetch(SCRIPT_URL + '?action=verify&pin=' + encodeURIComponent(pin));
    const text = await res.text();
    const json = JSON.parse(text);

    if (json.status === 'new' || json.status === 'ok') {
      currentPin = pin;
      showMainApp(json.data || []);
    } else {
      errEl.textContent = '❌ PIN غلط';
    }

  } catch (e) {
    errEl.textContent = '⚠ مشكلة في الاتصال';
    console.log(e);
  }

  btn.textContent = '🔓 دخول';
  btn.disabled = false;
}

// ====== SHOW APP ======
function showMainApp(data) {
  document.getElementById('lock-screen').style.display = 'none';
  document.getElementById('main-app').style.display = 'block';
  document.getElementById('fab-btn').style.display = 'flex';

  // ✅ منع config
  passwords = data.filter(r => r.id && r.id !== '__config__');

  renderAll();
}

// ====== RENDER ======
function renderAll() {
  renderList();
}

// ====== LIST ======
function renderList() {
  const el = document.getElementById('main-content');

  let html = '';

  passwords.forEach(p => {
    const id = String(p.id);

    // ✅ fix id
    const isOpen = openCards[id];
    const masked = showCards[id] ? p.password : '••••••••';

    html += `
    <div class="pcard">
      <div class="pcard-head" onclick="toggleCard('${id}')">
        <div>${p.name}</div>
      </div>

      ${isOpen ? `
        <div class="pcard-body open">
          <div>👤 ${p.username}</div>
          <div>🔑 ${masked}</div>

          <button onclick="toggleShow('${id}')">👁</button>
          <button onclick="copyTxt('${p.password}')">📋</button>
        </div>
      ` : ''}
    </div>
    `;
  });

  el.innerHTML = html;
}

// ====== FIX CLICK ======
function toggleCard(id) {
  id = String(id);
  openCards[id] = !openCards[id];
  renderList();
}

function toggleShow(id) {
  id = String(id);
  showCards[id] = !showCards[id];
  renderList();
}

// ====== COPY ======
function copyTxt(txt) {
  navigator.clipboard.writeText(txt);
  alert('تم النسخ');
}

</script>
