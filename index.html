<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#185FA5">
<title>باسوردات</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --blue: #185FA5; --blue-dark: #0C447C; --blue-light: #E6F1FB;
  --red: #c0392b; --bg: #F4F6F9; --card: #ffffff;
  --text: #1a1a2e; --text2: #6b7280; --text3: #9ca3af;
  --border: rgba(0,0,0,0.08); --border2: rgba(0,0,0,0.14);
  --radius: 14px; --radius-sm: 8px; --shadow: 0 2px 12px rgba(0,0,0,0.07);
}
body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* LOCK SCREEN */
#lock-screen {
  position: fixed; inset: 0; background: var(--blue); display: flex;
  flex-direction: column; align-items: center; justify-content: center;
  z-index: 1000; padding: 32px;
}
.lock-icon { font-size: 64px; margin-bottom: 16px; }
#lock-screen h1 { color: white; font-size: 24px; font-weight: 700; margin-bottom: 6px; }
#lock-screen p { color: rgba(255,255,255,0.75); font-size: 14px; margin-bottom: 28px; text-align: center; }
#pin-input {
  width: 100%; max-width: 300px; padding: 14px; border-radius: var(--radius);
  border: 2px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.15);
  color: white; font-size: 22px; text-align: center; letter-spacing: 6px; margin-bottom: 14px; outline: none;
}
#lock-btn { width: 100%; max-width: 300px; padding: 14px; border-radius: var(--radius); border: none; background: white; color: var(--blue); font-weight: 700; cursor: pointer; }

/* TOPBAR */
.topbar { background: var(--blue); color: white; padding: 16px; position: sticky; top: 0; z-index: 10; }
.topbar-row { display: flex; align-items: center; justify-content: space-between; }
.topbar-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 7px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; }

/* SEARCH & CHIPS */
.search-wrap { background: white; padding: 10px 16px; border-bottom: 1px solid var(--border); }
.search-wrap input { width: 100%; padding: 10px 14px; border-radius: 25px; border: 1px solid var(--border2); background: var(--bg); outline: none; text-align: right; }
.chips-wrap { display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto; background: white; border-bottom: 1px solid var(--border); }
.chip { flex-shrink: 0; padding: 6px 16px; border-radius: 20px; font-size: 13px; cursor: pointer; background: var(--bg); color: var(--text2); }
.chip.active { background: var(--blue); color: white; }

/* CONTENT */
.content { padding: 14px 16px 100px; }
.pcard { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 10px; border: 1px solid var(--border); }
.pcard-head { display: flex; align-items: center; gap: 12px; padding: 13px; cursor: pointer; }
.pcard-icon { width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
.pcard-info { flex: 1; }
.pcard-name { font-weight: 600; font-size: 15px; }
.pcard-user { font-size: 12px; color: var(--text2); }
.pcard-body { border-top: 1px solid var(--border); padding: 14px; display: none; }
.pcard-body.open { display: block; }

/* MODALS */
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: flex-end; }
.overlay.open { display: flex; }
.modal { background: white; border-radius: 20px 20px 0 0; width: 100%; max-height: 90vh; overflow-y: auto; padding: 20px; }
.form-input, .form-select { width: 100%; padding: 12px; border-radius: 8px; border: 1.5px solid var(--border2); margin-bottom: 12px; font-family: inherit; text-align: right; }

.fab { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--blue); color: white; border: none; padding: 15px 32px; border-radius: 30px; font-weight: 700; box-shadow: 0 4px 20px rgba(0,0,0,0.2); cursor: pointer; }
.toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 8px 20px; border-radius: 20px; opacity: 0; transition: 0.3s; pointer-events: none; z-index: 1000; }
.toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="lock-screen">
  <div class="lock-icon">🔐</div>
  <h1>باسوردات</h1>
  <p>أدخل رمز PIN للدخول</p>
  <input type="password" inputmode="numeric" maxlength="6" id="pin-input" placeholder="••••">
  <div id="lock-error" style="color:#ffcfcf; margin-bottom:10px; font-size: 14px;"></div>
  <button id="lock-btn" onclick="unlockApp()">🔓 دخول</button>
</div>

<div id="main-app" style="display:none">
  <div class="topbar">
    <div class="topbar-row">
      <div>
        <h1 style="font-size: 18px;">باسورداتي</h1>
        <div id="count-label" style="font-size:11px; opacity:0.8">جاري التحميل...</div>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="topbar-btn" onclick="openBulkModal()">📥 استيراد</button>
        <button class="topbar-btn" onclick="location.reload()">🔒</button>
      </div>
    </div>
  </div>

  <div class="search-wrap">
    <input type="text" id="search-input" placeholder="🔍 ابحث عن موقع أو إيميل..." oninput="renderList()">
  </div>

  <div class="chips-wrap" id="chips-wrap"></div>
  <div class="content" id="main-content"></div>
</div>

<button class="fab" id="fab-btn" onclick="openAddModal()" style="display:none">＋ إضافة جديد</button>

<div class="overlay" id="add-modal" onclick="if(event.target===this) closeModal('add-modal')">
  <div class="modal">
    <h3 id="form-title" style="margin-bottom:15px;">إضافة بيانات</h3>
    <input type="hidden" id="edit-id">
    <input class="form-input" id="f-name" placeholder="اسم الموقع (مثلاً: فيسبوك)">
    <input class="form-input" id="f-user" placeholder="الإيميل أو اسم المستخدم">
    <input class="form-input" id="f-pass" type="text" placeholder="كلمة المرور">
    <select class="form-select" id="f-group"></select>
    <div style="display:flex; gap:10px;">
      <button class="topbar-btn" style="background:var(--blue); flex:1; padding:12px;" onclick="savePassword()">حفظ</button>
      <button class="topbar-btn" style="background:#ccc; color:black; flex:1;" onclick="closeModal('add-modal')">إلغاء</button>
    </div>
  </div>
</div>

<div class="overlay" id="bulk-modal" onclick="if(event.target===this) closeModal('bulk-modal')">
  <div class="modal">
    <h3>استيراد جماعي</h3>
    <p style="font-size:12px; color:gray; margin:10px 0;">أدخل البيانات (الاسم، المستخدم، الباسورد) مفصولة بفواصل</p>
    <textarea id="bulk-input" class="form-input" style="height:150px; text-align:left; direction:ltr;" placeholder="Facebook, user@mail.com, pass123"></textarea>
    <button class="topbar-btn" style="background:var(--blue); width:100%; padding:12px;" onclick="processBulk()">تنفيذ الاستيراد</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
// تأكد من وضع رابط الـ EXEC الصحيح هنا
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw4PZ_KhvLMepMaLEpkkB6jgDMZzGEnTYiXypVMXMKbBFSzmkGYdPWnT4EWr0P4eyHozQ/exec';

let passwords = [];
let groups = ['عام', 'فيسبوك', 'جيميل', 'بنوك', 'عمل'];
let activeGroup = 'الكل';
let currentPin = '';
let openCards = {};

async function unlockApp() {
  const pinInput = document.getElementById('pin-input');
  const btn = document.getElementById('lock-btn');
  const errorDiv = document.getElementById('lock-error');
  
  if(pinInput.value.length < 4) {
    errorDiv.textContent = 'الـ PIN يجب أن يكون 4 أرقام على الأقل';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'جاري التحقق...';
  errorDiv.textContent = '';

  try {
    const res = await fetch(`${SCRIPT_URL}?action=verify&pin=${pinInput.value}`);
    const json = await res.json();

    if(json.status === 'ok') {
      currentPin = pinInput.value;
      passwords = json.data || [];
      document.getElementById('lock-screen').style.display = 'none';
      document.getElementById('main-app').style.display = 'block';
      document.getElementById('fab-btn').style.display = 'block';
      renderAll();
    } else {
      errorDiv.textContent = 'رمز PIN غير صحيح';
    }
  } catch(e) {
    console.error(e);
    alert('فشل الاتصال: تأكد من نشر السكريبت كـ Web App متاح للجميع (Anyone)');
  } finally {
    btn.disabled = false;
    btn.textContent = '🔓 دخول';
  }
}

function renderAll() {
  renderGroups();
  renderList();
  document.getElementById('count-label').textContent = `${passwords.length} كلمة مرور محفوظة`;
}

function renderGroups() {
  const wrap = document.getElementById('chips-wrap');
  wrap.innerHTML = ['الكل', ...groups].map(g => 
    `<div class="chip ${activeGroup===g?'active':''}" onclick="filterGroup('${g}')">${g}</div>`
  ).join('');
}

function filterGroup(g) {
  activeGroup = g;
  renderAll();
}

function renderList() {
  const q = document.getElementById('search-input').value.toLowerCase();
  const filtered = passwords.filter(p => {
    const mGroup = activeGroup === 'الكل' || p.group === activeGroup;
    const mSearch = (p.name || '').toLowerCase().includes(q) || (p.username || '').toLowerCase().includes(q);
    return mGroup && mSearch;
  });

  const content = document.getElementById('main-content');
  if(filtered.length === 0) {
    content.innerHTML = '<div style="text-align:center; padding:40px; color:#999;">لا توجد بيانات</div>';
    return;
  }

  content.innerHTML = filtered.map(p => `
    <div class="pcard">
      <div class="pcard-head" onclick="toggleCard('${p.id}')">
        <div class="pcard-icon" style="background:var(--blue-light); color:var(--blue)">🔑</div>
        <div class="pcard-info">
          <div class="pcard-name">${p.name}</div>
          <div class="pcard-user">${p.username}</div>
        </div>
        <button class="topbar-btn" style="color:var(--blue); background:none; font-weight:bold;" onclick="event.stopPropagation(); copy('${p.password}')">نسخ</button>
      </div>
      <div class="pcard-body ${openCards[p.id]?'open':''}">
        <p style="font-size:14px; margin-bottom:12px; background:#f9f9f9; padding:8px; border-radius:5px; text-align:left; direction:ltr;">
          <b>Pass:</b> <span style="font-family:monospace">${p.password}</span>
        </p>
        <div style="display:flex; gap:10px;">
          <button class="topbar-btn" style="background:#f0f7ff; color:var(--blue); flex:1; padding:10px;" onclick="openEdit('${p.id}')">تعديل</button>
          <button class="topbar-btn" style="background:#fff0f0; color:var(--red); flex:1; padding:10px;" onclick="deletePass('${p.id}')">حذف</button>
        </div>
      </div>
    </div>
  `).join('');
}

function toggleCard(id) {
  openCards[id] = !openCards[id];
  renderList();
}

async function savePassword() {
  const name = document.getElementById('f-name').value;
  const pass = document.getElementById('f-pass').value;
  if(!name || !pass) return alert('يرجى كتابة الاسم وكلمة المرور');

  const id = document.getElementById('edit-id').value || Date.now().toString();
  const action = document.getElementById('edit-id').value ? 'update' : 'add';

  const data = {
    action: action,
    id: id,
    name: name,
    username: document.getElementById('f-user').value,
    password: pass,
    group: document.getElementById('f-group').value,
    pin: currentPin
  };

  showToast('جاري الحفظ...');
  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      body: new URLSearchParams(data)
    });
    
    if(action === 'add') passwords.push(data);
    else {
      const idx = passwords.findIndex(x => x.id === id);
      passwords[idx] = data;
    }
    
    closeModal('add-modal');
    renderAll();
    showToast('تم الحفظ بنجاح');
  } catch(e) {
    showToast('خطأ في الاتصال بالسيرفر');
  }
}

async function deletePass(id) {
  if(!confirm('هل أنت متأكد من الحذف؟')) return;
  showToast('جاري الحذف...');
  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      body: new URLSearchParams({action:'delete', id: id, pin: currentPin})
    });
    passwords = passwords.filter(p => p.id !== id);
    renderAll();
    showToast('تم الحذف بنجاح');
  } catch(e) { showToast('فشل الحذف'); }
}

async function processBulk() {
  const input = document.getElementById('bulk-input').value;
  if (!input.trim()) return alert('يرجى إدخال بيانات أولاً');
  
  const lines = input.split('\n');
  showToast('جاري استيراد البيانات...');
  
  for (let line of lines) {
    const parts = line.split(',');
    if (parts.length >= 2) {
      const data = {
        action: 'add',
        id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
        name: parts[0].trim(),
        username: parts[1] ? parts[1].trim() : '',
        password: parts[2] ? parts[2].trim() : '',
        group: 'عام',
        pin: currentPin
      };
      
      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          body: new URLSearchParams(data)
        });
      } catch(e) { console.error('Error on line:', line); }
    }
  }
  
  closeModal('bulk-modal');
  showToast('تم الاستيراد بنجاح');
  // تحديث البيانات من السيرفر
  const res = await fetch(`${SCRIPT_URL}?action=verify&pin=${currentPin}`);
  const json = await res.json();
  passwords = json.data || [];
  renderAll();
}

function openAddModal() {
  document.getElementById('form-title').textContent = 'إضافة بيانات جديدة';
  document.getElementById('edit-id').value = '';
  document.getElementById('f-name').value = '';
  document.getElementById('f-user').value = '';
  document.getElementById('f-pass').value = '';
  const sel = document.getElementById('f-group');
  sel.innerHTML = groups.map(g => `<option value="${g}">${g}</option>`).join('');
  document.getElementById('add-modal').classList.add('open');
}

function openEdit(id) {
  const p = passwords.find(x => x.id === id);
  document.getElementById('form-title').textContent = 'تعديل البيانات';
  document.getElementById('edit-id').value = p.id;
  document.getElementById('f-name').value = p.name;
  document.getElementById('f-user').value = p.username;
  document.getElementById('f-pass').value = p.password;
  const sel = document.getElementById('f-group');
  sel.innerHTML = groups.map(g => `<option value="${g}" ${g===p.group?'selected':''}>${g}</option>`).join('');
  document.getElementById('add-modal').classList.add('open');
}

function openBulkModal() {
  document.getElementById('bulk-input').value = '';
  document.getElementById('bulk-modal').classList.add('open');
}

function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}

function copy(txt) {
  navigator.clipboard.writeText(txt);
  showToast('تم النسخ إلى الحافظة');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
</body>
</html>
